worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 100m;

    upstream api_upstream {
        server api:8000;
    }

    upstream web_upstream {
        server web:5173;
    }

    # Marketing + panel: localhost / www
    # Public storefronts: *.localhost (e.g. maria.localhost)
    server {
        listen 80;
        server_name localhost www.localhost ~^(?<subdomain>.+)\.localhost$;

        # API
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Subdomain $subdomain;
        }

        # OpenAPI docs
        location /docs {
            proxy_pass http://api_upstream/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://api_upstream/openapi.json;
            proxy_set_header Host $host;
        }

        # Uploaded media
        location /media/ {
            proxy_pass http://api_upstream/media/;
            proxy_set_header Host $host;
        }

        # React (Vite HMR in development)
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Subdomain $subdomain;
        }
    }
}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multisite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multisite}
      POSTGRES_DB: ${POSTGRES_DB:-multisite}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No host port: avoids clash with local Postgres. Use `docker compose exec db psql` if needed.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multisite} -d ${POSTGRES_DB:-multisite}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-multisite}:${POSTGRES_PASSWORD:-multisite}@db:5432/${POSTGRES_DB:-multisite}
    volumes:
      - ./api:/app
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  uploads_data:
  web_node_modules:
